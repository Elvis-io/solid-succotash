name: Validate pyRevit extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate extension
        run: python tools/validate_extension.py
      - name: Build release archive
        run: python tools/build_release.py
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: CurtainWallTools-pyRevit-v6
          path: dist/CurtainWallTools_pyRevit_v6_Isolated_View_Template.zip
          if-no-files-found: error
